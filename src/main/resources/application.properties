spring.application.name=spring-boot
spring.datasource.url=jdbc:mysql://localhost:3306/supplychainx_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080

# show operations sorted
springdoc.swagger-ui.operationsSorter=alpha
# enable try it out (default true)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=DEBUG

logging.file.path=.

# OAuth2 Resource Server Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/SupplyChainX
# This allows Spring to verify the signature of the tokens Keycloak sends
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/SupplyChainX/protocol/openid-connect/certs

