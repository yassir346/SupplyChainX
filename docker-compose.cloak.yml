services:
  mysql:
    image: mysql:8.0
    container_name: supplychain-db
    environment:
      MYSQL_DATABASE: supplychainx
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: supplychain-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      - mysql